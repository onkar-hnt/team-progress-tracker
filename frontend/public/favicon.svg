<!-- Three ascending bars: progress tracked over time. Flat shapes only, so the
     mark survives being read at 16px. Colours match styles/_variables.scss. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Team Progress Tracker">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3155a6" />
      <stop offset="1" stop-color="#172554" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#badge)" />

  <g fill="#ffffff">
    <rect x="7" y="18" width="4.5" height="7" rx="1.5" opacity="0.62" />
    <rect x="13.75" y="13" width="4.5" height="12" rx="1.5" opacity="0.82" />
    <rect x="20.5" y="8" width="4.5" height="17" rx="1.5" />
  </g>
</svg>
