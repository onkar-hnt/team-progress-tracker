<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The base placeholder below is substituted at build time, so the icon
      resolves under the repository subpath on GitHub Pages as well as at the
      root during development. Do not replace it with a leading slash.
    -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!-- iOS ignores an SVG favicon on the home screen. -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <title>Team Progress Tracker</title>
    <meta
      name="description"
      content="Daily updates, assigned tasks and mentor feedback for the team, in one place."
    />

    <!-- Tints the browser chrome on mobile to match the app header. -->
    <meta name="theme-color" content="#3155a6" />

    <!--
      Internal tool: no reason for it to appear in search results. Preview
      crawlers ignore this, which is also why there is no robots.txt disallowing
      everything: several of them honour that file and would drop the card.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Absolute, unlike the icons: a scraper has no document to resolve a
         relative path against. Change if the site moves off this Pages URL. -->
    <link rel="canonical" href="https://onkar-hnt.github.io/team-progress-tracker/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Team Progress Tracker" />
    <meta property="og:title" content="Team Progress Tracker" />
    <meta
      property="og:description"
      content="Daily updates, assigned tasks and mentor feedback for the team, in one place."
    />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://onkar-hnt.github.io/team-progress-tracker/" />
    <meta
      property="og:image"
      content="https://onkar-hnt.github.io/team-progress-tracker/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Team Progress Tracker, with three ascending bars on a deep blue background."
    />

    <!-- Card type only: X falls back to the Open Graph tags for the rest. -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      The whole interface is rendered by React, so without scripting the page
      is blank. Saying so beats leaving somebody looking at nothing.
    -->
    <noscript>
      <p style="font: 1rem/1.5 system-ui, sans-serif; margin: 3rem auto; max-width: 32rem">
        Team Progress Tracker needs JavaScript to run. Please enable it and reload the page.
      </p>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
