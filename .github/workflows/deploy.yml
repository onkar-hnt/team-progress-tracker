name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # Only the frontend is published to Pages; the backend runs elsewhere.
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci

      # Fails before the build rather than after the deploy.
      #
      # Without this the build still succeeds and the result looks like a
      # working site that cannot read or save a thing, because it has no
      # backend to talk to. That is a far worse outcome than a red run, so a
      # missing value is made to stop the pipeline here, where the message
      # says which one and where to put it.
      - name: Check deployment configuration
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Missing repository configuration: VITE_API_BASE_URL"
            echo "Add it under Settings > Secrets and variables > Actions."
            echo "It is a URL rather than a credential, so a repository *variable* is the right home."
            exit 1
          fi

          # The deployed site is served over HTTPS, and a browser refuses to
          # call a plain-HTTP API from it, so a mixed-content base URL would
          # only fail once somebody opened the page.
          case "$VITE_API_BASE_URL" in
            https://*|/*) ;;
            *)
              echo "::error::VITE_API_BASE_URL must be an https:// origin, or a same-origin path beginning with /."
              exit 1
              ;;
          esac

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The gateway address is read by Vite here and inlined into the bundle.
      # That is by design: it is a URL, and the access token the Identity
      # service issues at sign-in is what decides what a caller may do. No
      # secret belongs in this block.
      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
          VITE_AUTH_MODE: api
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
